[env:cyd]
platform  = espressif32
board     = esp32dev
framework = arduino

lib_deps =
    h2zero/NimBLE-Arduino          @ ^1.4.2
    bblanchon/ArduinoJson          @ ^7.0.0
    bodmer/TFT_eSPI                @ ^2.5.43

board_build.partitions = min_spiffs.csv

; ── TFT_eSPI config — ESP32-2432S035 (3.5" ST7796, 480×320): DC=21, BL=27 ──────
; All pin and driver settings are passed here — no User_Setup.h needed.
build_flags =
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
    ; TFT_eSPI driver
    -DUSER_SETUP_LOADED
    -DILI9488_DRIVER
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    ; Display SPI pins
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    ; Fonts to include
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    ; SPI speed
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    ; Touch (XPT2046 on shared SPI bus)
    -DTOUCH_CS=33

monitor_speed = 115200
upload_speed  = 460800

; ── Guition JC3248W535C (ESP32-S3 + AXS15231B QSPI, 320×480 → landscape 480×320) ──────────────
[env:guition]
platform  = espressif32@6.6.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.partitions          = min_spiffs.csv

build_flags =
    -DBOARD_GUITION
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
    -DBOARD_HAS_PSRAM
    ; route Serial to the built-in USB Serial/JTAG so logs are readable over USB
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    h2zero/NimBLE-Arduino                      @ ^1.4.2
    bblanchon/ArduinoJson                      @ ^7.0.0
    moononournation/GFX Library for Arduino    @ 1.4.9
